<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Shake It remix art</title>
  <desc id="desc">High-energy geometric lines and title text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5f4d"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g stroke="#1a1a1a" stroke-width="22" stroke-opacity="0.22">
    <line x1="0" y1="200" x2="1200" y2="900"/>
    <line x1="0" y1="350" x2="1200" y2="1050"/>
    <line x1="0" y1="30" x2="1000" y2="920"/>
  </g>
  <text x="90" y="940" fill="#1b1b1b" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700">Shake It (Remix)</text>
  <text x="90" y="1020" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="44">KeyNee</text>
</svg>
