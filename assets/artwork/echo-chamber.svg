<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Echo Chamber cover art</title>
  <desc id="desc">Dark futuristic cover with concentric rings and title text.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#3a4f9e"/>
      <stop offset="55%" stop-color="#171f45"/>
      <stop offset="100%" stop-color="#090c16"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g fill="none" stroke="#8bc8ff" stroke-opacity="0.7">
    <circle cx="600" cy="480" r="120" stroke-width="5"/>
    <circle cx="600" cy="480" r="200" stroke-width="4"/>
    <circle cx="600" cy="480" r="290" stroke-width="3"/>
    <circle cx="600" cy="480" r="390" stroke-width="2.5"/>
  </g>
  <text x="90" y="960" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700">Echo Chamber</text>
  <text x="90" y="1040" fill="#dce8ff" font-family="Arial, Helvetica, sans-serif" font-size="48">KeyNee</text>
</svg>
