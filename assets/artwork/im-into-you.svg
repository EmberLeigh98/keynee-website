<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">I'm Into You cover art</title>
  <desc id="desc">Abstract neon gradient background with KeyNee title text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7ac6"/>
      <stop offset="50%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#3cc8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="920" cy="300" r="260" fill="rgba(255,255,255,0.15)"/>
  <circle cx="300" cy="860" r="300" fill="rgba(0,0,0,0.18)"/>
  <text x="90" y="950" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700">I'm Into You</text>
  <text x="90" y="1040" fill="#f4f4ff" font-family="Arial, Helvetica, sans-serif" font-size="48">KeyNee</text>
</svg>
